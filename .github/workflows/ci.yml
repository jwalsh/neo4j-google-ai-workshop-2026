# What a push has to pass: no credentials file in history, and the unit
# tests, which touch no network and no database. The tests include the
# layout of every agent's Cypher (workshop.dashboard-test) and the spans
# sent to a collector (workshop.otlp-test).
#
# cypherfmt is not run here. experiments/015-cypherfmt says why: its check
# fails any file that ends in a newline and passes one that does not parse.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # guard-env reads history
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.0.1530
          bb: 1.13.223
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: No credentials file in history
        run: make guard-env
      - name: Unit tests
        run: bb test
